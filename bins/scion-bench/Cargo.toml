[package]
name = "scion-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = { workspace = true, features = ["std"] }
derived = { workspace = true }
ops = { workspace = true }
scion-core = { workspace = true }
