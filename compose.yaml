# Dev and test environment: Postgres and an S3-compatible object store.
# Start with `cargo xtask dev-up`, stop with `cargo xtask dev-down`.
# Credentials and ports must match crates/store/src/testing.rs.
name: scion-dev

services:
  postgres:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_USER: scion
      POSTGRES_PASSWORD: scion
      # Every test database is created from this template.
      POSTGRES_DB: scion_template
    # Test data is disposable, so trade durability for speed.
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=1000
    # Bounded, so a leak fails loudly instead of consuming host memory. The
    # largest database, a cached 3M-file bench repo, is about 1.6 GB; the
    # bench tests keep at most MAX_CACHED cached repos, sized against this
    # budget in bins/scion-bench/tests/common/mod.rs.
    tmpfs:
      - /var/lib/postgresql:size=12g
    ports:
      - 127.0.0.1:55432:5432
    healthcheck:
      # TCP probe: during initialization the server listens on the socket only.
      # It connects to `postgres`, never to the template: a session on the
      # template makes `CREATE DATABASE ... TEMPLATE` fail.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=scion", "--dbname=postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
      start_interval: 500ms

  s3:
    image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
    command: ["mini", "-dir=/data", "-bucket=scion-test"]
    environment:
      AWS_ACCESS_KEY_ID: scion
      AWS_SECRET_ACCESS_KEY: scion-dev-secret
    ports:
      - 127.0.0.1:58333:8333
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
      start_interval: 500ms
